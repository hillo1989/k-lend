# GHOST-Seite als Apache-VirtualHost (von deploy/hetzner/setup.sh erzeugt).
# Braucht die Module proxy und proxy_http (setup.sh schaltet sie mit a2enmod ein).
# Zuerst nur HTTP (Port 80). HTTPS richtet danach certbot ein:
#   certbot --apache -d @DOMAIN@
# certbot legt dafür einen zweiten VirtualHost auf 443 an und lädt Apache neu
# (reload) – andere Seiten auf diesem Apache bleiben unberührt.
<VirtualHost *:80>
    ServerName @DOMAIN@

    ProxyPreserveHost On
    ProxyRequests Off
    # Senden über die Wallet dauert bis 170 s (api.ts WALLET_SEND_TIMEOUT_MS);
    # länger warten als die Seite, damit sie „unklar“ melden kann (A17-7)
    ProxyTimeout 180
    # Wallet-Aktionen schicken Plan und signierte Tx (bis ~130 kB); 1 MB (A17-5)
    LimitRequestBody 1048576
    ProxyPass        / http://127.0.0.1:@GHOST_PORT@/
    ProxyPassReverse / http://127.0.0.1:@GHOST_PORT@/

    ErrorLog ${APACHE_LOG_DIR}/ghost-error.log
    CustomLog ${APACHE_LOG_DIR}/ghost-access.log combined
</VirtualHost>
