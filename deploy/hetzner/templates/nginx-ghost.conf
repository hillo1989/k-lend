# GHOST-Seite als nginx-Server-Block (von deploy/hetzner/setup.sh erzeugt).
# Zuerst nur HTTP (Port 80). HTTPS richtet danach certbot ein:
#   certbot --nginx -d @DOMAIN@
# certbot ergänzt diesen Block um „listen 443 ssl“ und das Zertifikat und lädt
# nginx neu (reload) – andere Seiten auf diesem nginx bleiben unberührt.
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    # Wallet-Aktionen schicken Plan und signierte Tx (bis ~130 kB, die Seite
    # selbst nimmt bis 768 kB an); 64k ließ mint/repay/close scheitern (Audit 17 A17-5)
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:@GHOST_PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Senden über die Wallet dauert bis 170 s (api.ts WALLET_SEND_TIMEOUT_MS);
        # länger warten als die Seite, damit sie „unklar“ melden kann (A17-7)
        proxy_read_timeout 180s;
    }
}
